syntax = "proto3";
package conf;

option go_package = "auth/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  string name = 1;
  string version = 2;
  Server server = 3;
  Tracer tracer = 4;
  DB db = 5;
  Log log = 6;
  Redis redis = 7;
  Task task = 8;
}

message DB {
  string driver = 1;
  string dsn = 2;
  bool migrate = 3;
}

message Log {
  string level = 1;
  bool JSON = 2;
  bool showSQL = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    bool docs = 4;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message Jwt {
    bool enable = 1;
    string key = 2;
    string expires = 3;
  }
  string machineId = 1;
  HTTP http = 2;
  GRPC grpc = 3;
  bool enablePprof = 4;
  string language = 5;
  bool validate = 6;
  bool nocache = 7;
  Jwt jwt = 8;
  bool skipCaptcha = 9;
}

message Tracer {
  message Otlp {
    string endpoint = 1;
    bool insecure = 2;
  }
  message Stdout {
    bool prettyPrint = 1;
  }
  bool enable = 1;
  float ratio = 2;
  Otlp otlp = 3;
  Stdout stdout = 4;
}

message Redis {
  string dsn = 1;
}

message CronTask {
  string name = 1;
  string expr = 2;
  int64 timeout = 3;
  int64 retry = 4;
}

message Task {
  map<string, CronTask> cron = 1;
  message Group {
    string loginFailed = 1;
    string loginLast = 2;
    string refreshHotspot = 3;
    string refreshHotspotManual = 4;
  }
  Group group = 2;
}
