# Database configuration
db:
  # Database driver: postgres or mysql
  driver: postgres

  # DSN examples:
  #   postgres: "postgresql://root:password@127.0.0.1:5432/auth?sslmode=disable&TimeZone=UTC"
  #   mysql:    "root:password@tcp(127.0.0.1:3306)/auth?charset=utf8mb4&parseTime=True&loc=Local"
  dsn: "postgresql://root:password@127.0.0.1:5432/auth?sslmode=disable&TimeZone=UTC"

  # Run migrations on startup
  migrate: true

  # Model generation settings (gentool)
  gen:
    # Tables to exclude from model generation
    # schema_migrations is always excluded by default
    exclude:
      - schema_migrations
      # Add more tables to exclude here:
      # - audit_logs
      # - temp_table

    # Customization options
    customization:
      # Use carbon.DateTime instead of time.Time for timestamp fields
      # Requires: github.com/golang-module/carbon/v2
      useCarbonTime: true

      # Add ",string" to JSON tags for specific fields (for JavaScript compatibility)
      # Serializes int64 as string to avoid precision loss
      # Format:
      #   - field_name           # Global: applies to all tables
      #   - table_name.field_name # Table-specific: only applies to specified table
      # Example:
      #   - id                   # All tables' id field
      #   - order.order_id       # Only order table's order_id field
      jsonStringFields:
        - id
        - user.role_id
        - user.lock_expire
        - user.wrong

      # Remove pointer (*) from nullable fields
      # Warning: NULL values will be zero values (0, "", false, etc.)
      removeNullablePointer: false

    # GORM associations
    # Format: model_table|related_table|FieldName|relation_type|gorm_tag
    # relation_type: has_one, has_many, belongs_to, many_to_many
    # gorm_tag examples:
    #   - foreignKey:UserID
    #   - references:UserID
    #   - foreignKey:PostID;references:ID
    # Examples:
    #   - 'user|role|Role|has_one|foreignKey:RoleID'
    #   - 'post|post_resource|Resources|has_many|foreignKey:PostID'
    #   - 'post|user|User|has_one|references:UserID'
    #   - 'post|post|Quote|has_one|foreignKey:QuoteID'  # self-reference
    #   - 'post_comment|post_comment|[]Children|has_many|foreignKey:ParentID'  # array with slice prefix
    association:
      - 'user_group|user|[]Users|many_to_many|many2many:user_user_group_relation'
      - 'user|role|Role|has_one|foreignKey:RoleID'

